name: Test and publish container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q beets_mvp tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cratekeep:candidate
          build-args: |
            BUILD_SHA=${{ github.sha }}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: tests/container_smoke.sh cratekeep:candidate "$RUNNER_TEMP/cratekeep-smoke-evidence"
      - run: docker save cratekeep:candidate | gzip > "$RUNNER_TEMP/cratekeep-candidate.tar.gz"
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@v4
        with:
          name: cratekeep-smoke-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/cratekeep-smoke-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: cratekeep-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cratekeep-candidate.tar.gz
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cratekeep-candidate-${{ github.sha }}
          path: ${{ runner.temp }}
      - run: gunzip -c "$RUNNER_TEMP/cratekeep-candidate.tar.gz" | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag cratekeep:candidate ghcr.io/kylejschultz/cratekeep:${{ github.sha }}
          docker tag cratekeep:candidate ghcr.io/kylejschultz/cratekeep:latest
          docker push ghcr.io/kylejschultz/cratekeep:${{ github.sha }}
          docker push ghcr.io/kylejschultz/cratekeep:latest
