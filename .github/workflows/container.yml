name: Test and publish container

on:
  pull_request:
    branches: [dev, release]
  push:
    branches: [dev, release]
    tags: ["v*"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tags: ${{ steps.identity.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: identity
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          python scripts/release-identity.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- beets_mvp/static/ui
      - run: python -m pytest -q
      - run: python -m compileall -q beets_mvp tests

  build:
    needs: [identity, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: cratekeep:candidate
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.identity.outputs.version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: tests/container_smoke.sh cratekeep:candidate "$RUNNER_TEMP/cratekeep-smoke-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cratekeep-smoke-evidence-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cratekeep-smoke-evidence
          retention-days: 14

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    needs: [identity, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.identity.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.identity.outputs.version }}
