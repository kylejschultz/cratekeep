name: Test and publish container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- beets_mvp/static/ui
      - run: python -m pytest -q
      - run: python -m compileall -q beets_mvp tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cratekeep:candidate
          build-args: |
            BUILD_SHA=${{ github.sha }}
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: tests/container_smoke.sh cratekeep:candidate "$RUNNER_TEMP/cratekeep-smoke-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: cratekeep-smoke-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/cratekeep-smoke-evidence
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kylejschultz/cratekeep:${{ github.sha }}
            ghcr.io/kylejschultz/cratekeep:latest
          build-args: |
            BUILD_SHA=${{ github.sha }}
