services:
  app:
    image: ghcr.io/kylejschultz/cratekeep:latest
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "8788:8788"
    environment:
      STATE_PATH: /data/config
    volumes:
      - ./data/inbox:/data/inbox
      - ./data/library:/data/library
      - ./data/config:/data/config
    restart: unless-stopped
