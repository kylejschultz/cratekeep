{% macro sidebar(active_page, build_sha) -%}
<a class="skip-link" href="#main-content">Skip to main content</a><aside class="sidebar" id="sidebar" aria-label="Application sidebar"><div class="brand"><img src="{{ url_for('static', filename='cratekeep-logo.png') }}" alt=""><div class="brand-copy"><span class="brand-name">Cratekeep</span><span class="brand-tagline">Music library manager</span></div></div><nav aria-label="Primary navigation"><ul class="nav-list"><li><a class="nav-link" href="{{ url_for('index') }}"{% if active_page == 'overview' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Overview</span></a></li><li><a class="nav-link" href="{{ url_for('inbox_page') }}"{% if active_page == 'inbox' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">↓</span><span class="nav-label">Inbox</span></a></li><li><a class="nav-link" href="{{ url_for('library_page') }}"{% if active_page == 'library' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">♫</span><span class="nav-label">Library</span></a></li><li><a class="nav-link" href="{{ url_for('settings') }}"{% if active_page == 'settings' %} aria-current="page"{% endif %}><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-label">Settings</span></a></li></ul></nav><div class="sidebar-footer"><div class="theme-toggle"><span>Dark mode</span><button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">☾</button></div><a class="utility-link" href="https://github.com/kylejschultz/cratekeep" target="_blank" rel="noreferrer">GitHub</a><span class="build-sha" title="Build SHA">build {{ build_sha[:7] if build_sha else 'unknown' }}</span></div><button class="collapse-button" id="collapse-sidebar" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar">‹</button></aside><button class="scrim" id="sidebar-scrim" type="button" aria-label="Close navigation" tabindex="-1"></button>
{%- endmacro %}

{% macro mobile_header() -%}
<header class="mobile-header"><button class="menu-button" id="open-sidebar" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">☰</button><img src="{{ url_for('static', filename='cratekeep-logo.png') }}" alt=""><strong>Cratekeep</strong></header>
{%- endmacro %}
